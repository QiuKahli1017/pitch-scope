name: Test and build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current app version as a GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PitchScope --collect-all pyaudiowpatch main.py
      - name: Verify packaged application
        shell: pwsh
        run: |
          $process = Start-Process dist/PitchScope.exe -ArgumentList '--self-test', 'self-test.json' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Executable self-test failed' }
          $report = Get-Content self-test.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Executable self-test failed' }
          Get-Content self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: PitchScope-Windows-x64
          path: dist/PitchScope.exe
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        run: Compress-Archive -Path dist/PitchScope.exe,README.md,LICENSE -DestinationPath PitchScope-Windows-x64.zip
      - name: Publish release
        if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c 'from pitchscope import __version__; print(__version__)'
          gh release create "v$version" PitchScope-Windows-x64.zip --target "$env:GITHUB_SHA" --title "PitchScope v$version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
